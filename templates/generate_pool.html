<!DOCTYPE html>
<html>

<head>

    <title>Generate Cab Pools - MoveInSync</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="navbar">

    <div class="brand">
        MoveInSync
    </div>

    <div>

        <a href="/pooling/view">
            Cab Pools
        </a>

        <a href="/admin/dashboard">
            Dashboard
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</div>


<div class="container">

    <div class="form-card card">

        <div class="page-header">

            <h1>Generate Cab Pools</h1>

            <p>
                Group employees into efficient cab pools.
            </p>

        </div>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <div class="form-group">

                <label>Shift</label>

                <select name="shift_id" required>

                    {% for shift in shifts %}

                        <option value="{{ shift.id }}">

                            {{ shift.office_name }}
                            -
                            {{ shift.shift_name }}
                            -
                            {{ shift.start_time }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>Date</label>

                <input
                    type="date"
                    name="booking_date"
                    required
                >

            </div>


            <div class="form-group">

                <label>Cab Capacity</label>

                <select name="capacity">

                    <option value="4">
                        4 Seats
                    </option>

                    <option value="6">
                        6 Seats
                    </option>

                </select>

            </div>


            <button
                type="submit"
                style="width: 100%;"
            >
                Generate Pools
            </button>

        </form>


        <div class="actions">

            <a
                class="btn btn-secondary"
                href="/pooling/view"
            >
                View Existing Pools
            </a>

            <a
                class="btn btn-secondary"
                href="/admin/dashboard"
            >
                Dashboard
            </a>

        </div>

    </div>

</div>

</body>

</html>
