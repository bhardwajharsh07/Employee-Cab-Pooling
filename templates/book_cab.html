<!DOCTYPE html>
<html>
<head>
    <title>Book Cab</title>
</head>

<body>

    <h1>Book a Cab</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}


    <form method="POST">

        <label>Shift:</label>

        <select name="shift_id" required>

            <option value="">
                Select Shift
            </option>

            {% for shift in shifts %}

                <option value="{{ shift.id }}">

                    {{ shift.office_name }}
                    -
                    {{ shift.shift_name }}
                    -
                    {{ shift.start_time }}

                </option>

            {% endfor %}

        </select>

        <br><br>


        <label>Booking Date:</label>

        <input
            type="date"
            name="booking_date"
            required
        >

        <br><br>


        <button type="submit">
            Book Cab
        </button>

    </form>


    <br>

    <a href="/booking/my-bookings">
        View My Bookings
    </a>

    <br><br>

    <a href="/employee/dashboard">
        Back to Dashboard
    </a>

</body>
</html>
