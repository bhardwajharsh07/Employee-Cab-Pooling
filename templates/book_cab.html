<!DOCTYPE html>
<html>

<head>

    <title>Book a Cab - MoveInSync</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="navbar">

    <div class="brand">
        MoveInSync
    </div>

    <div>

        <a href="/booking/my-bookings">
            My Bookings
        </a>

        <a href="/employee/dashboard">
            Dashboard
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</div>


<div class="container">

    <div class="form-card card">

        <div class="page-header">

            <h1>Book a Cab</h1>

            <p>
                Select your shift and travel date.
            </p>

        </div>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <div class="form-group">

                <label>Shift</label>

                <select name="shift_id" required>

                    <option value="">
                        Select Shift
                    </option>

                    {% for shift in shifts %}

                        <option value="{{ shift.id }}">

                            {{ shift.office_name }}
                            -
                            {{ shift.shift_name }}
                            -
                            {{ shift.start_time }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>Booking Date</label>

                <input
                    type="date"
                    name="booking_date"
                    required
                >

            </div>


            <button
                type="submit"
                style="width: 100%;"
            >
                Book Cab
            </button>

        </form>


        <div class="actions">

            <a
                class="btn btn-secondary"
                href="/booking/my-bookings"
            >
                My Bookings
            </a>

            <a
                class="btn btn-secondary"
                href="/employee/dashboard"
            >
                Dashboard
            </a>

        </div>

    </div>

</div>

</body>

</html>
